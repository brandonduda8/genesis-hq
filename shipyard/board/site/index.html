<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0a0d">
<title>Genesis Shipyard</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#0b0a0d; --card:#1c1820; --text:#f7f1e8; --dim:#9c9488; --gold:#f5b942; --live:#6fd69b; --stale:#ffc266; --unknown:#8f8a99; --line:#2a2530; }
  :root[data-theme="light"] { --bg:#faf7f2; --card:#ffffff; --text:#1c1820; --dim:#6b645a; --gold:#a8730f; --live:#1f8a4c; --stale:#a36500; --unknown:#6b6577; --line:#e6e0d6; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  header, main, footer { max-width:760px; margin:0 auto; padding:16px }
  h1 { margin:0; font-size:22px; color:var(--gold); letter-spacing:.3px }
  .sub { color:var(--dim); font-size:13px; margin-top:4px }
  .banner { margin-top:12px; padding:10px 12px; border-radius:10px; border:1px solid var(--stale); color:var(--stale); font-size:13px; display:none }
  .app { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px }
  .row { display:flex; align-items:center; gap:10px }
  .name { font-weight:700; font-size:17px; flex:1; min-width:0 }
  .pill { font-size:11px; font-weight:700; letter-spacing:.8px; padding:3px 9px; border-radius:999px; border:1px solid currentColor; white-space:nowrap }
  .LIVE { color:var(--live) } .STALE { color:var(--stale) } .UNKNOWN { color:var(--unknown) }
  .what { color:var(--dim); font-size:13px; margin:4px 0 8px }
  .why { font-size:13px; margin:6px 0 }
  .meta { font-size:12px; color:var(--dim) }
  details { margin-top:8px } summary { cursor:pointer; color:var(--gold); font-size:13px; padding:6px 0 }
  ul { margin:6px 0 0; padding-left:18px } li { margin:4px 0; font-size:13px; overflow-wrap:anywhere }
  a { color:var(--gold) } .ok { color:var(--live) } .bad { color:var(--stale) } .na { color:var(--unknown) }
  footer { color:var(--dim); font-size:12px }
  button { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 10px; font:inherit; font-size:12px }
</style>
</head>
<body>
<header>
  <div class="row"><h1 style="flex:1">Genesis Shipyard</h1><button id="theme" type="button">Theme</button></div>
  <div class="sub" id="gen">Loading the board…</div>
  <div class="banner" id="aged"></div>
</header>
<main id="apps" aria-live="polite"></main>
<footer>
  <p id="law"></p>
  <p>Read-only. Statuses are computed from GitHub evidence when the board is built. Approvals, missions and the worker stop
  switch are not on this board yet; they are shown as missing, never faked.</p>
</footer>
<script>
(function () {
  var root = document.documentElement;
  try { var t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById("theme").onclick = function () {
    root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function link(href, text) { var a = el("a", null, text); a.href = href; a.rel = "noopener"; return a; }
  function ago(iso, now) { if (!iso) return "time unknown"; var h = (now - Date.parse(iso)) / 36e5; return h < 1 ? "under an hour ago" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago"; }

  function render(b) {
    var now = Date.now(), gen = Date.parse(b.generated_at), ageH = (now - gen) / 36e5, fresh = b.fresh_hours || 72;
    document.getElementById("gen").textContent = "Board built " + ago(b.generated_at, now) + " (" + b.generated_at + ")";
    document.getElementById("law").textContent = b.law || "";
    var aged = ageH > fresh;
    if (aged) {
      var ban = document.getElementById("aged");
      ban.style.display = "block";
      ban.textContent = "This board is " + Math.round(ageH) + " h old, older than its " + fresh + " h fresh window, so nothing on it is shown as LIVE. Rebuild it to refresh.";
    }
    var host = document.getElementById("apps"); host.textContent = "";
    b.apps.forEach(function (a) {
      var st = (aged && a.status === "LIVE") ? "STALE" : a.status;
      var card = el("section", "app"); card.setAttribute("aria-label", a.name + ", " + st);
      var row = el("div", "row"); row.appendChild(el("div", "name", a.name)); row.appendChild(el("span", "pill " + st, st)); card.appendChild(row);
      card.appendChild(el("div", "what", a.what));
      card.appendChild(el("div", "why", (aged && a.status === "LIVE") ? "Was LIVE when built; the board itself is now too old." : a.status_why));
      card.appendChild(el("div", "meta", a.stage_note));
      card.appendChild(el("div", "meta", "Build: " + a.owner + " · QA: " + a.qa + " · Accepts: " + a.acceptance));
      var bl = el("details"); bl.appendChild(el("summary", null, "Blockers (" + a.blockers.length + ")"));
      var ul = el("ul"); a.blockers.forEach(function (x) { var li = el("li", null, x.text + " (" + x.owner + ") "); li.appendChild(link(x.source, "source")); ul.appendChild(li); });
      bl.appendChild(ul); card.appendChild(bl);
      var ev = el("details"); ev.appendChild(el("summary", null, "Evidence (" + a.evidence.length + ")"));
      var ul2 = el("ul");
      if (!a.evidence.length) ul2.appendChild(el("li", "na", "No evidence exists yet."));
      a.evidence.forEach(function (e) {
        var mark = !e.fetched ? ["na", "UNSEEN"] : e.ok ? ["ok", "OK"] : ["bad", "NOT GREEN"];
        var li = el("li"); li.appendChild(el("span", mark[0], mark[1] + " ")); li.appendChild(document.createTextNode(e.label + ": " + e.detail + (e.sha ? " @" + e.sha : "") + (e.at ? " · " + ago(e.at, now) + " " : " ")));
        if (e.url) li.appendChild(link(e.url, "open"));
        ul2.appendChild(li);
      });
      ev.appendChild(ul2); card.appendChild(ev);
      host.appendChild(card);
    });
  }
  function fail(msg) { document.getElementById("gen").textContent = msg; }
  fetch("board.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render).catch(function () { fail("Board data unavailable (offline and never cached). Nothing is shown rather than guessed."); });
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
})();
</script>
</body>
</html>
